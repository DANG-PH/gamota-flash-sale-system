syntax = "proto3";

package ticket;

service TicketService {
  // Admin tạo event
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);

  // Đặt vé
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  
  // Kiểm tra trạng thái đơn hàng
  rpc GetOrderStatus(GetOrderStatusRequest) returns (GetOrderStatusResponse);

  // Lấy số lượng vé còn lại
  rpc GetStock(GetStockRequest) returns (GetStockResponse);

  // Update vé trong db ( queue dùng )
  rpc UpdateStock(UpdateStockRequest) returns (UpdateStockResponse);

  // Tạo bản ghi order trong DB ( queue dùng )
  rpc InsertOrder(InsertOrderRequest) returns (InsertOrderResponse);
}

// Request đặt vé
message CreateOrderRequest {
  int32 user_id = 1;
  int32 event_id = 2;
  int32 quantity = 3; // số lượng vé muốn mua
}

// Response đặt vé
message CreateOrderResponse {
  bool success = 1;
  string message = 2;
  int32 order_id = 3; // chỉ khi success = true
}

// Request kiểm tra trạng thái đơn hàng
message GetOrderStatusRequest {
  int32 order_id = 1;
}

// Response trạng thái đơn hàng
message GetOrderStatusResponse {
  int32 order_id = 1;
  bool success = 2;
  string status = 3; // PENDING, SUCCESS, FAILED
}

// Request kiểm tra stock
message GetStockRequest {
  int32 event_id = 1;
}

// Response stock
message GetStockResponse {
  int32 event_id = 1;
  int32 remaining_stock = 2; // Số lượng vé còn lại hiện tại
}

message UpdateStockResponse {
  bool success = 1;
}

message InsertOrderResponse {
  bool success = 1;
}

message UpdateStockRequest {
  int32 event_id = 1;
  int32 quantity = 2;
}

message InsertOrderRequest {
  int32 user_id = 1;
  int32 event_id = 2;
  int32 quantity = 3;
}

message CreateEventRequest {
  string name = 1;
  int32 stock = 2;
}

message CreateEventResponse {
  bool success = 1;
}
